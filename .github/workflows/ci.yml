name: CI - Testing & Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  COVERAGE_THRESHOLD: 80
  COVERAGE_FUNCTIONS_THRESHOLD: 50

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Install dependencies and cache for downstream jobs
  # ─────────────────────────────────────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Run unit and integration tests with coverage enforcement
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run tests with coverage
        run: npx turbo test -- --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Dependency vulnerability scanning (npm audit)
  # Blocks on critical/high severity vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run npm audit (critical and high severity)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Generate audit report
        if: failure()
        run: |
          echo "## Dependency Vulnerability Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Critical or high severity vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          echo "Run \`npm audit\` locally for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --json > audit-report.json || true
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat audit-report.json | head -100 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Static code analysis (ESLint)
  # ─────────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run ESLint
        run: npx turbo lint

      - name: Run TypeScript type checking
        run: npx turbo build --filter='./packages/*'

  # ─────────────────────────────────────────────────────────────────────────────
  # Run Playwright E2E API & Real-time tests
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E API Tests
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wedding_digital_saas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run Prisma Migrations
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wedding_digital_saas_test?schema=public # nosecret
        run: npx prisma db push --force-reset

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e --workspace=packages/api

      - name: Upload E2E Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/api/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Security gate - blocks deployment if any security check fails
  # ─────────────────────────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [test, dependency-audit, static-analysis, e2e-tests]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## CI Security Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "::error::Test suite failed. Deployment blocked."
            FAILED=true
          else
            echo "✅ Tests: PASSED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.dependency-audit.result }}" != "success" ]; then
            echo "❌ Dependency Audit: FAILED (critical/high vulnerabilities found)" >> $GITHUB_STEP_SUMMARY
            echo "::error::Critical/high severity vulnerabilities detected. Deployment blocked."
            FAILED=true
          else
            echo "✅ Dependency Audit: PASSED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "❌ Static Analysis: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "::error::Static code analysis failed. Deployment blocked."
            FAILED=true
          else
            echo "✅ Static Analysis: PASSED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "❌ E2E Tests: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "::error::E2E test suite failed. Deployment blocked."
            FAILED=true
          else
            echo "✅ E2E Tests: PASSED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FAILED" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚫 **Deployment blocked** — resolve all issues above before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All checks passed** — safe to deploy." >> $GITHUB_STEP_SUMMARY
