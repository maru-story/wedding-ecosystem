name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/realtime/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  preflight:
    name: Pre-flight Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npx turbo run test --filter=@wedding/api --filter=@wedding/realtime --filter=@wedding/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Deploy on Render
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering deployment via Render Deploy Hook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Render response ($HTTP_CODE): $BODY"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Render deployment triggered successfully"
            else
              echo "⚠️ Render deploy hook returned HTTP $HTTP_CODE"
            fi
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL not set in GitHub Secrets. Render will rely on auto-deploy on push."
          fi

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          DEPLOY_STATUS="${{ job.status }}"
          COMMIT_HASH="${{ github.sha }}"
          TRIGGERED_BY="${{ github.actor }}"
          
          if [ "$DEPLOY_STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="Success"
          else
            EMOJI="❌"
            STATUS_TEXT="Failed"
          fi

          MESSAGE="${EMOJI} *Backend Deployment to Render: ${STATUS_TEXT}*\n"
          MESSAGE+="• Branch: \`${{ github.ref_name }}\`\n"
          MESSAGE+="• Commit: \`${COMMIT_HASH:0:8}\`\n"
          MESSAGE+="• Triggered by: ${TRIGGERED_BY}\n"
          MESSAGE+="• Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\": \"$MESSAGE\"}" || true
          fi
