name: Deploy Backend to Fly.io

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/api/**'
      - 'packages/realtime/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'Dockerfile'
      - 'fly.toml'
      - 'fly.staging.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  preflight:
    name: Pre-flight Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npx turbo run test --filter=@wedding/api --filter=@wedding/realtime --filter=@wedding/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploy Staging on push to develop branch
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/develop'
        run: flyctl deploy --config fly.staging.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Deploy Production on push to main branch
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          DEPLOY_STATUS="${{ job.status }}"
          COMMIT_HASH="${{ github.sha }}"
          TRIGGERED_BY="${{ github.actor }}"
          
          if [ "$DEPLOY_STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="Success"
          else
            EMOJI="❌"
            STATUS_TEXT="Failed"
          fi

          MESSAGE="${EMOJI} *Backend Deployment to Fly.io: ${STATUS_TEXT}*\n"
          MESSAGE+="• Branch: \`${{ github.ref_name }}\`\n"
          MESSAGE+="• Commit: \`${COMMIT_HASH:0:8}\`\n"
          MESSAGE+="• Triggered by: ${TRIGGERED_BY}\n"
          MESSAGE+="• Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\": \"$MESSAGE\"}" || true
          fi
